# CI: the same gate the developer runs locally (`mvn test`) — 530+ integration
# tests on H2, no Docker or PostgreSQL required. Also the release workflow's
# safety net: a tag's commit has already passed here before it can be released.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run tests
        run: mvn -B -ntp test
