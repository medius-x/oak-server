# Release: a pushed v* tag packages target/oak-server.jar (pom finalName — the
# fixed name Dockerfile.server and the client's provisioning pipeline expect)
# and attaches it to a GitHub Release. The release IS the deployment source:
# space-client's release workflow downloads this artifact of the SAME tag to
# bundle into its installer, and the client's last-resort provisioning fallback
# fetches the latest release jar — version pairing is enforced by the gate below.
#
# How to release:
#   1. bump <version> in pom.xml AND package.json in space-client to the same
#      value (e.g. 0.2.0), commit both repos
#   2. tag THIS repo with the matching v-prefixed tag (v0.2.0) and push it
#   3. tag space-client with the same tag and push — its workflow pulls the
#      server jar of this release into the installer
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Version gate — tag must match the pom version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "tag=${TAG_VERSION} pom=${POM_VERSION}"
          if [ "${TAG_VERSION}" != "${POM_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pom version ${POM_VERSION} — bump pom.xml to ${TAG_VERSION} and re-tag"
            exit 1
          fi

      - name: Package (tests included — the artifact is released, it must be green)
        run: mvn -B -ntp package

      - name: Publish the jar to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/oak-server.jar \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
          || gh release upload "$GITHUB_REF_NAME" target/oak-server.jar --clobber
