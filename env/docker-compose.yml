# OAK — peripheral services for local development.
#
# Brings up everything oak-server talks to:
#   - PostgreSQL  : relational store (users, guilds, channels, messages)
#   - MinIO       : S3-compatible object storage for media attachments
#   - Janus       : SFU for 3+ participant voice/video rooms & screen sharing
#   - Coturn      : TURN server, P2P fallback for 1-on-1 calls behind NAT
#
# Usage:
#   cd oak-server/env
#   docker compose up -d                          # peripheral only (dev: oak on the host)
#   docker compose --profile full up -d --build   # + oak container + Caddy TLS entry point
#   docker compose logs -f janus
#   docker compose down            # stop, keep data
#   docker compose down -v         # stop and WIPE all volumes
#
# The DEFAULT topology is dev: oak-server (Spring Boot) runs on the host and
# connects to these services via localhost + the mapped ports below; space/oak
# clients on the same host reach Janus/Coturn the same way. The "full" profile
# adds the containerized oak-server (env/Dockerfile.server — see its header for
# the jar one-liner) and the Caddy reverse proxy (env/caddy/) that terminates
# TLS and is the ONLY public HTTP surface: https://<host> → oak + /janus* →
# janus, https://<host>:9443 → MinIO. In that topology the peripheral ports
# below (5432/9000/9001/8088/8188/7088) must be firewalled off from outside.
#
# Variables are read from the .env file next to this compose file.

services:

  # ───────────────────────────── PostgreSQL ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: oak-postgres
    restart: unless-stopped
    # Slow-query logging (logging round follow-up, 2026-10-06): statements slower
    # than 200 ms land in the container log — WITH their duration, which is the DB
    # diagnostics Hibernate's show-sql never had. They ride `docker logs`, so the
    # server logs download (containers/postgres.log) carries them. The second flag
    # DISABLES bind-parameter values in those records: the SQL shape ($1, $2 …) is
    # diagnostic, but the VALUES are message texts and invite secrets (verified
    # against the PG16 docs: 0 = bind parameters are not logged for non-error
    # statement logs; JDBC talks the extended protocol, so its parameters are
    # exactly what this silences). The SQL form for an N+1 hunt stays a
    # point-in-time tool: flip spring.jpa.show-sql for the hunt, never steady-state.
    command: ["postgres", "-c", "log_min_duration_statement=200ms", "-c", "log_parameter_max_length=0"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - oak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────── MinIO ──────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: oak-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"     # S3 API  (oak-server talks here)
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # web console
    volumes:
      - oak-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────── MinIO bootstrap (one-shot) ──────────────────
  # Creates the scoped app user oak-server signs/uploads with (bucket-only
  # policy, no admin): the root credentials above stay console/bootstrap-only,
  # so a leaked app credential cannot read/list/delete outside oak-attachments
  # or manage the instance. Idempotent — safe on every `docker compose up`.
  # Reuses the minio image itself (it ships the mc client at /usr/bin/mc) —
  # no extra image to pull.
  minio-init:
    image: minio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
        echo '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:CreateBucket"],"Resource":["arn:aws:s3:::*"]},{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::oak-attachments"]},{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::oak-attachments/*"]}]}' > /tmp/oak-app-policy.json
        mc admin policy create local oak-app /tmp/oak-app-policy.json || true
        mc admin user add local ${MINIO_APP_USER} ${MINIO_APP_PASSWORD}
        mc admin policy attach local oak-app --user ${MINIO_APP_USER} || true
        echo "[minio-init] app user ${MINIO_APP_USER} ready (bucket-only policy)"

  # ──────────────────────────────── Janus ──────────────────────────────
  # SFU for multi-user voice/video (3+) and screen sharing.
  # oak-server creates rooms via the HTTP REST API (port 8088);
  # the JavaFX client connects directly via WebSocket (port 8188).
  # Running on the canyan image defaults: videoroom + websocket transport enabled.
  janus:
    # Locally built image: canyan/janus-gateway + janus/janus.jcfg with
    # token_auth = true (every API request must carry a token minted by
    # oak-server via the Admin API; see JanusVoiceAccessService) and a
    # RUNTIME-SUBSTITUTED admin_secret — the image entrypoint seds
    # JANUS_ADMIN_SECRET (passed below from .env) into the baked config at
    # container start, so the secret never lives in the image or the repo.
    # It must equal oak-server's oak.janus.admin-secret: it guards the Admin
    # API (token minting) AND is the HMAC key every videoroom pin/secret
    # derives from.
    # The config is BAKED IN, not bind-mounted: a bind-mounted janus.jcfg
    # wedges janus on Docker Desktop file sharing (live bug — see
    # janus/Dockerfile). Rebuild after editing it: docker compose build janus.
    # PROD NOTE: 7088 is host-mapped only for the dev topology (oak-server
    # runs on the host). In a real deployment keep it inside the Docker
    # network — the admin secret is the only thing between the network and
    # gateway-wide token minting.
    build: ./janus
    image: oak-janus:secured
    container_name: oak-janus
    restart: unless-stopped
    environment:
      JANUS_ADMIN_SECRET: ${JANUS_ADMIN_SECRET}
      # Rewrites Janus host candidates to the machine's address (see
      # nat_1_1_mapping in janus/janus.jcfg): the RTP range is published 1:1,
      # so the address is the only wrong part of the container's own candidate.
      # On dev TURN_EXTERNAL_IP is the LAN IP (env/.env) — reachable from the
      # host through Docker's UDP port-proxy, like coturn's relay candidates.
      NAT_1_1_IP: ${TURN_EXTERNAL_IP}
    ports:
      - "${JANUS_REST_PORT:-8088}:8088"     # REST API  (oak-server -> Janus)
      - "${JANUS_WS_PORT:-8188}:8188"       # WebSocket (JavaFX -> Janus)
      - "${JANUS_ADMIN_PORT:-7088}:7088"    # admin API
      # RTP media range — must match Janus' media_port_range (default 2000-4000).
      # Clients on the host use these UDP ports for SRTP media.
      - "2000-4000:2000-4000/udp"

  # ──────────────────────────────── Coturn ─────────────────────────────
  # TURN/STUN server, P2P fallback for 1-on-1 calls behind strict NAT.
  # No config file: all settings are CLI flags, with values substituted from
  # .env by Compose at parse time. (The base coturn image ships no envsubst,
  # so we avoid runtime templating of a config file.)
  # KNOWN LIMITATION (live smoke 2026-09): behind Docker Desktop's UDP
  # port-proxy coturn sees every client as the gateway IP (172.x.0.1), and the
  # TURN permission machinery then drops ALL peer traffic (allocations succeed,
  # relay candidates gather, but media never passes — rp=0/sp=0). Host
  # networking does NOT expose the ports to the Windows host, and UDP straight
  # to the container's docker-IP does not pass from Windows either. TURN-relay
  # on this dev machine therefore cannot carry media; P2P host candidates work
  # fine (all regular calls). A full RELAY/ICE-restart smoke needs coturn on a
  # real Linux host or two machines with a reachable TURN server.
  coturn:
    image: coturn/coturn:latest
    container_name: oak-coturn
    restart: unless-stopped
    entrypoint: ["turnserver"]
    command:
      - --realm=${TURN_REALM}
      - --server-name=${TURN_REALM}
      - --listening-ip=0.0.0.0
      # The non-standard port (34780, not 3478): Docker Desktop leaked UDP 3478
      # on this host once (stale port-proxy), so we map 34780 -> 3478.
      - --external-ip=${TURN_EXTERNAL_IP}
      # Short-lived REST-API credentials (no static user anymore): oak-server
      # mints time-boxed per-request tickets signed with TURN_STATIC_AUTH_SECRET
      # (see TurnCredentialIssuer) — a leaked credential expires instead of
      # opening the relay forever.
      - --use-auth-secret
      - --static-auth-secret=${TURN_STATIC_AUTH_SECRET}
      - --min-port=${TURN_MIN_PORT}
      - --max-port=${TURN_MAX_PORT}
      - --fingerprint
      - --no-multicast-peers
      - --no-cli
      - --log-file=stdout
    ports:
      - "${TURN_LISTEN_PORT:-34780}:3478/tcp"
      - "${TURN_LISTEN_PORT:-34780}:3478/udp"
      - "${TURN_TLS_PORT:-5349}:5349/tcp"      # TURN over TLS
      - "${TURN_TLS_PORT:-5349}:5349/udp"
      # Relay range — keep in sync with TURN_MIN_PORT/TURN_MAX_PORT.
      # 55000-55050 avoids Windows' excluded UDP ranges (49152-49451 etc.).
      - "${TURN_MIN_PORT:-55000}-${TURN_MAX_PORT:-55050}:${TURN_MIN_PORT:-55000}-${TURN_MAX_PORT:-55050}/udp"

  # ──────────────────────── oak-server (profile full) ──────────────────
  # The Spring Boot server itself, containerized. NEVER host-maps 8080: Caddy
  # (below) is the only public HTTP surface; the REST/WS port stays inside the
  # compose network. Runs the "prod" profile, which drops the dev fallbacks —
  # the required secrets (JWT_SECRET, POSTGRES/MINIO/Janus/TURN) must be in
  # .env or the container refuses to boot.
  oak:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: oak-server:local
    container_name: oak-server
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-oak}
      POSTGRES_USER: ${POSTGRES_USER:-oak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate one in env/.env}
      JWT_SECRET: ${JWT_SECRET:?generate one (openssl rand -hex 32) in env/.env}
      # MinIO: the server signs against the internal endpoint; presigned URLs
      # handed to clients carry the PUBLIC one (through Caddy's own port).
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: https://${OAK_PUBLIC_HOST:-localhost}:${OAK_MINIO_HTTPS_PORT:-9443}
      MINIO_APP_USER: ${MINIO_APP_USER:-oak_app}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?set in env/.env}
      # Janus: the server drives rooms over the internal REST; clients receive
      # the PUBLIC https URL (RoomResponse) routed by Caddy.
      JANUS_REST_URL: http://janus:8088/janus
      JANUS_PUBLIC_REST_URL: https://${OAK_PUBLIC_HOST:-localhost}:${OAK_HTTPS_PORT:-443}/janus
      JANUS_ADMIN_URL: http://janus:7088/admin
      JANUS_ADMIN_SECRET: ${JANUS_ADMIN_SECRET:?set in env/.env}
      # TURN rides plain UDP outside Caddy — the host ICE clients dial is the
      # public one; the port must match coturn's mapping above.
      TURN_HOST: ${OAK_PUBLIC_HOST:-localhost}
      TURN_LISTEN_PORT: ${TURN_LISTEN_PORT:-34780}
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:?set in env/.env}
      TURN_REALM: ${TURN_REALM:-oak.local}
    volumes:
      # The rolling file log (read by GET /api/server/logs) survives re-creates.
      - oak-server-logs:/root/.oak-server

  # ─────────────────────── Caddy TLS entry point (full) ────────────────
  # Terminates TLS and routes: https://<host> → oak (REST + /ws) with /janus*
  # → janus, and https://<host>:9443 → MinIO (own port — S3 signatures, see
  # env/caddy/Caddyfile). Certificate: files from ./caddy/certs (self-signed
  # for bare-IP hosts; gen-self-signed.sh); a domain deployment drops the tls
  # lines for automatic Let's Encrypt.
  caddy:
    image: caddy:2
    container_name: oak-caddy
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      - oak
      - janus
      - minio
    environment:
      OAK_SITE_ADDRESS: ${OAK_SITE_ADDRESS:-https://localhost}
      OAK_MINIO_SITE_ADDRESS: ${OAK_MINIO_SITE_ADDRESS:-https://localhost:9443}
      OAK_TLS_CERT: /certs/tls.crt
      OAK_TLS_KEY: /certs/tls.key
    ports:
      - "${OAK_HTTPS_PORT:-443}:443"
      - "${OAK_MINIO_HTTPS_PORT:-9443}:9443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
      - oak-caddy-data:/data
      - oak-caddy-config:/config

volumes:
  oak-postgres-data:
  oak-minio-data:
  oak-server-logs:
  oak-caddy-data:
  oak-caddy-config:
