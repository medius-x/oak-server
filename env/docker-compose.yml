# OAK — peripheral services for local development.
#
# Brings up everything oak-server talks to:
#   - PostgreSQL  : relational store (users, guilds, channels, messages)
#   - MinIO       : S3-compatible object storage for media attachments
#   - Janus       : SFU for 3+ participant voice/video rooms & screen sharing
#   - Coturn      : TURN server, P2P fallback for 1-on-1 calls behind NAT
#
# Usage:
#   cd oak-server/env
#   docker compose up -d
#   docker compose logs -f janus
#   docker compose down            # stop, keep data
#   docker compose down -v         # stop and WIPE all volumes
#
# oak-server (Spring Boot) runs on the host, not in this compose file.
# It connects to these services via localhost + the mapped ports below.
# JavaFX clients on the same host reach Janus/Coturn the same way.
#
# NOTE: this is a dev setup — everything is plain HTTP/WS (no TLS).
# For production put a reverse proxy (TLS termination) in front and
# set a real public IP / hostname for Coturn (external-ip) and Janus.
#
# Variables are read from the .env file next to this compose file.

services:

  # ───────────────────────────── PostgreSQL ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: oak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - oak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────── MinIO ──────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: oak-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"     # S3 API  (oak-server talks here)
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # web console
    volumes:
      - oak-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────── Janus ──────────────────────────────
  # SFU for multi-user voice/video (3+) and screen sharing.
  # oak-server creates rooms via the HTTP REST API (port 8088);
  # the JavaFX client connects directly via WebSocket (port 8188).
  # Running on the canyan image defaults: videoroom + websocket transport enabled.
  janus:
    # Locally built image: canyan/janus-gateway + janus/janus.jcfg with
    # token_auth = true (every API request must carry a token minted by
    # oak-server via the Admin API; see JanusVoiceAccessService) and
    # admin_secret = "janus_admin_secret" (matches JANUS_ADMIN_SECRET in .env —
    # the stock default "janusoverlord" is a live hole with 7088 host-mapped).
    # BAKED IN, not bind-mounted: a bind-mounted janus.jcfg wedges janus on
    # Docker Desktop file sharing (live bug — see janus/Dockerfile). Rebuild
    # after editing the config: docker compose build janus.
    build: ./janus
    image: oak-janus:secured
    container_name: oak-janus
    restart: unless-stopped
    ports:
      - "${JANUS_REST_PORT:-8088}:8088"     # REST API  (oak-server -> Janus)
      - "${JANUS_WS_PORT:-8188}:8188"       # WebSocket (JavaFX -> Janus)
      - "${JANUS_ADMIN_PORT:-7088}:7088"    # admin API
      # RTP media range — must match Janus' media_port_range (default 2000-4000).
      # Clients on the host use these UDP ports for SRTP media.
      - "2000-4000:2000-4000/udp"

  # ──────────────────────────────── Coturn ─────────────────────────────
  # TURN/STUN server, P2P fallback for 1-on-1 calls behind strict NAT.
  # No config file: all settings are CLI flags, with values substituted from
  # .env by Compose at parse time. (The base coturn image ships no envsubst,
  # so we avoid runtime templating of a config file.)
  coturn:
    image: coturn/coturn:latest
    container_name: oak-coturn
    restart: unless-stopped
    entrypoint: ["turnserver"]
    command:
      - --realm=${TURN_REALM}
      - --server-name=${TURN_REALM}
      - --listening-ip=0.0.0.0
      - --external-ip=${TURN_EXTERNAL_IP}
      - --user=${TURN_USER}:${TURN_PASSWORD}
      - --min-port=${TURN_MIN_PORT}
      - --max-port=${TURN_MAX_PORT}
      - --lt-cred-mech
      - --fingerprint
      - --no-multicast-peers
      - --no-cli
      - --log-file=stdout
    ports:
      # TURN/STUN listening. Non-standard host port: Docker Desktop leaked
      # UDP 3478 (stale port-proxy), so we map host 34780 -> container 3478.
      - "${TURN_LISTEN_PORT:-34780}:3478/tcp"
      - "${TURN_LISTEN_PORT:-34780}:3478/udp"
      - "${TURN_TLS_PORT:-5349}:5349/tcp"      # TURN over TLS
      - "${TURN_TLS_PORT:-5349}:5349/udp"
      # Relay range — keep in sync with TURN_MIN_PORT/TURN_MAX_PORT.
      # 55000-55050 avoids Windows' excluded UDP ranges (49152-49451 etc.).
      - "${TURN_MIN_PORT:-55000}-${TURN_MAX_PORT:-55050}:${TURN_MIN_PORT:-55000}-${TURN_MAX_PORT:-55050}/udp"

volumes:
  oak-postgres-data:
  oak-minio-data:
