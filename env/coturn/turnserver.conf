# Coturn config for the OAK dev environment.
# This file is run through `envsubst` before launch (see docker-compose entrypoint),
# so ${VAR} placeholders are replaced from the .env file.

# Realm advertised to clients — must match what the WebRTC client is configured with.
realm=${TURN_REALM}
server-name=${TURN_REALM}

# Listen on all interfaces inside the container (ports are mapped by compose).
listening-ip=0.0.0.0

# IP clients should use in relayed ICE candidates.
# 127.0.0.1 works when the JavaFX client runs on the same host as Docker.
# For LAN/remote clients set TURN_EXTERNAL_IP to the host's reachable IP in .env.
external-ip=${TURN_EXTERNAL_IP}

# Static long-term credentials (user:password). The oak-server hands these
# (along with realm) to clients requesting a TURN relay candidate.
user=${TURN_USER}:${TURN_PASSWORD}

# Relay UDP port range — keep in sync with the mapped range in docker-compose.yml.
min-port=${TURN_MIN_PORT}
max-port=${TURN_MAX_PORT}

# WebRTC-friendly settings.
lt-cred-mech        # use long-term credential mechanism (requires `user` above)
fingerprint         # include STUN fingerprint in messages
no-multicast-peers  # refuse multicast relay peers
no-cli              # no interactive CLI (we log to stdout)

# Log to stdout so `docker compose logs coturn` works.
log-file=stdout
simple-log
