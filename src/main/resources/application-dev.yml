# OAK server — local development profile (the app on the host, peripheral
# services in env/docker-compose.yml). Everything else lives in the shared base
# application.yml; this file only adds what is genuinely dev-specific.

# WS/STOMP framework logging stays at INFO: the connection ping indicator keeps a
# STOMP frame flowing every 10 s per client, and at DEBUG these packages log EVERY
# frame — the live log grew megabytes of pure ping noise (2026-10-07). Raise to
# DEBUG temporarily when you need handshakes/CONNECT/SUBSCRIBE/SEND routing visible.
logging:
  level:
    org.springframework.web.socket: INFO
    org.springframework.messaging.simp: INFO

spring:
  # env/.env is git-ignored (per-machine secrets since the security round
  # 2026-10-05); env/.env.example is the committed template. optional — a
  # missing file only falls back to the defaults below. The explicit
  # [.properties] suffix makes Spring parse the extensionless-dotfile name as
  # a properties file (verified live: without it the import is silently
  # ignored and the placeholder fallbacks below win).
  config.import: optional:file:./env/.env[.properties]
