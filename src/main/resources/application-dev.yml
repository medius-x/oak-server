# OAK server — local development profile.
# Targets the peripheral services brought up by env/docker-compose.yml.
# The .env file is imported below, so the Spring side and the compose side
# share ONE source of truth for secrets; real environment variables still
# win over .env values (standard Spring precedence).

# WS/STOMP framework logging stays at INFO: the connection ping indicator keeps a
# STOMP frame flowing every 10 s per client, and at DEBUG these packages log EVERY
# frame — the live log grew megabytes of pure ping noise (2026-10-07). Raise to
# DEBUG temporarily when you need handshakes/CONNECT/SUBSCRIBE/SEND routing visible.
logging:
  level:
    org.springframework.web.socket: INFO
    org.springframework.messaging.simp: INFO

spring:
  # env/.env is git-ignored (per-machine secrets since the security round
  # 2026-10-05); env/.env.example is the committed template. optional — a
  # missing file only falls back to the defaults below. The explicit
  # [.properties] suffix makes Spring parse the extensionless-dotfile name as
  # a properties file (verified live: without it the import is silently
  # ignored and the placeholder fallbacks below win).
  config.import: optional:file:./env/.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:oak}
    username: ${POSTGRES_USER:oak}
    password: ${POSTGRES_PASSWORD:oakpass}
    driver-class-name: org.postgresql.Driver
    # Wait up to 60 s for the first pool connection instead of failing the boot instantly when
    # Postgres is still coming up (docker compose). On Windows the Docker port proxy accepts TCP
    # without a live container, so the driver gets a misleading EOFException in the SSL handshake
    # instead of "connection refused". Only initial pool creation retries; runtime failures still
    # fail fast. Dev-only — the test profile (H2) is unaffected.
    hikari:
      initialization-fail-timeout: 60000

  # Flyway owns the schema. baseline-on-migrate: the pre-existing dev database
  # (created by ddl-auto=update + the hand migrations) absorbs V1 WITHOUT executing
  # it — only V2+ actually run; a fresh database executes V1 and gets the full schema.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  jpa:
    # Flyway migrations (db/migration/V*.sql) are the ONLY way the schema changes.
    # Hibernate no longer updates it — validate just cross-checks the entity
    # mapping against the migrated schema (the drift alarm).
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    # SQL logging is OFF (logging round follow-up, 2026-10-06): show-sql prints every
    # statement WITHOUT bind parameters or timings, which diagnoses almost nothing —
    # while dominating the log volume and crowding the useful [api]/[auth-refresh]/
    # [storage-gc] lines out of the now-bounded 24h retention window. Slow queries
    # have a proper home: postgres log_min_duration_statement (env/docker-compose.yml,
    # carried into the logs download as containers/postgres.log). Flip this to true
    # ONLY for a targeted N+1 hunt, never as a steady state. NEVER enable
    # org.hibernate.orm.jdbc.bind: TRACE instead — it prints the bound VALUES, and
    # the DB holds plaintext invite secrets and refresh-token hashes.
    show-sql: false

  # WebSocket (signaling + text chat). In-memory user registry, no broker needed.
  # JWT auth is enforced by Spring Security on the WS handshake (see oak-server/CLAUDE.md).
  # websocket:
  #   endpoints configured in code (oak.server.config / oak.server.websocket)

# OAK-specific service connections, grouped under the "oak" prefix.
oak:
  # JWT auth. Dev secret only — override JWT_SECRET in real deployments.
  # Must be >= 256 bits (32+ bytes) for HS256.
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:8h}  # parsed as Duration
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:720h}  # 30 days
    # How often expired refresh tokens are purged (parsed as Duration).
    refresh-cleanup-interval: ${OAK_REFRESH_CLEANUP_INTERVAL:PT6H}

  # MinIO — S3-compatible object storage for media attachments.
  # oak-server generates presigned URLs; clients upload/download directly.
  # The credentials are the SCOPED APP USER (bucket-only policy, created by
  # the one-shot minio-init compose service) — NOT the MinIO root: a leaked
  # app key cannot list/delete outside oak-attachments.
  minio:
    enabled: ${MINIO_ENABLED:true}                           # false in tests (noop signer)
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}        # server -> MinIO (internal)
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}  # client -> MinIO (baked into presigned URLs)
    access-key: ${MINIO_APP_USER:oak_app}
    secret-key: ${MINIO_APP_PASSWORD:oak_app_dev_secret_change_me}
    bucket: ${MINIO_BUCKET:oak-attachments}  # created by oak-server at startup if missing

  # Janus — SFU for 3+ participant voice/video rooms & screen sharing.
  # oak-server manages rooms via REST; the JavaFX client connects over WebSocket.
  # admin-secret has NO safe fallback: it guards the Admin API AND derives every
  # room pin/secret — it must come from env/.env (or a real env var), unique
  # per deployment. Without it Janus admin calls fail loudly (403), which is
  # the point.
  janus:
    rest-url: ${JANUS_REST_URL:http://localhost:8088/janus}  # server -> Janus REST
    ws-url: ${JANUS_WS_URL:ws://localhost:8188}              # client -> Janus WebSocket
    admin-secret: ${JANUS_ADMIN_SECRET:change-me-janus-admin}
    admin-url: ${JANUS_ADMIN_URL:http://localhost:7088/admin}  # Admin API (token bookkeeping)
    admin-enabled: ${JANUS_ADMIN_ENABLED:true}                # false in tests -> noop service

  # Coturn — TURN server for P2P fallback (1-on-1 calls behind NAT).
  # static-auth-secret backs coturn's --use-auth-secret mode: each
  # /api/call/config call mints a short-lived per-member ticket
  # (TurnCredentialIssuer); the wire (username/credential fields) is unchanged.
  turn:
    host: ${TURN_HOST:localhost}
    # 34780 mirrors env/.env: Docker Desktop leaked UDP 3478 on the host.
    port: ${TURN_LISTEN_PORT:34780}
    static-auth-secret: ${TURN_STATIC_AUTH_SECRET:change-me-turn-static-auth}
    credential-ttl: ${TURN_CREDENTIAL_TTL:1h}  # parsed as Duration
    realm: ${TURN_REALM:oak.local}

# Notes:
#  - Secrets (MinIO app password, Janus admin secret, TURN static-auth secret)
#    live in env/.env (git-ignored; template: env/.env.example). First run:
#    `cp env/.env.example env/.env`, generate secrets (`openssl rand -hex 32`),
#    `docker compose up -d` (minio-init creates the scoped app user), restart oak-server.
#  - Everything here is plain HTTP/WS (no TLS). TLS termination belongs on a reverse
#    proxy in front of oak-server for non-dev environments; for LAN deployments do
#    NOT host-map Janus :7088 and the MinIO console :9001.
